<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무명회 테니스 클럽</title>
<meta name="theme-color" content="#2f7a5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="무명회">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5ef;--surface:#fff;--ink:#17261f;--muted:#66756c;--line:#dde3d8;--court:#1d4d3b;--ball:#d4e640;--ballink:#26330a;--bad:#b3402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--surface:#18261f;--ink:#e9f0e6;--muted:#93a69a;--line:#2a3b32;--court:#2f7a5c;--bad:#e27a68}}
:root[data-theme="dark"]{--bg:#101a15;--surface:#18261f;--ink:#e9f0e6;--muted:#93a69a;--line:#2a3b32;--court:#2f7a5c;--bad:#e27a68}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
header{background:var(--court);color:#fff;padding:22px 16px 0}
.wrap{max-width:860px;margin:0 auto}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:50%;flex:none;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.ball{width:22px;height:22px;border-radius:50%;background:var(--ball);position:relative;flex:none}
.ball:before{content:"";position:absolute;inset:3px -9px;border:2px solid #fff;border-radius:50%;clip-path:inset(0 60% 0 0);opacity:.0}
.sub{margin:4px 0 14px;color:#cfe3d8;font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{white-space:nowrap;flex:1;min-width:84px;border:0;background:transparent;color:#cfe3d8;font:inherit;font-weight:500;padding:12px 8px;cursor:pointer;border-radius:10px 10px 0 0}
nav button.on{background:var(--bg);color:var(--ink);font-weight:700}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ball);outline-offset:1px}
main{padding:18px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{color:var(--muted);font-size:13px}
.stats3{grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:0}.stats3 .stat{padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}.stats3 .stat b{font-size:20px}.stats3 .stat span{font-size:11px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px;flex:1;min-width:110px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.btn{border:0;background:var(--ball);color:var(--ballink);font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:5px 10px;font-size:13px;font-weight:500}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.off{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:18px;max-height:84%}}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--muted)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ball);color:var(--ballink);border-color:transparent;font-weight:700}
.tag.no{color:var(--bad);border-color:var(--bad)}
.empty{color:var(--muted);padding:10px 0;font-size:14px}
.rank{width:28px;text-align:center;font-weight:900;font-size:18px}
.rank.top{color:var(--court)}
.grid{display:grid;gap:6px;overflow-x:auto}
.slot{display:grid;grid-template-columns:64px repeat(3,1fr);gap:6px;min-width:420px}
.cell{border:1px dashed var(--line);border-radius:8px;padding:7px 8px;font-size:13px;min-height:42px;background:transparent;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}
.cell.free:hover{border-color:var(--court);background:var(--bg)}
.cell.taken{border:1px solid var(--court);background:var(--court);color:#fff;cursor:default}
.cell.taken small{color:#cfe3d8;display:block}
.time{font-size:13px;color:var(--muted);padding-top:10px}
.colh{font-size:13px;font-weight:700;text-align:center}
.score{font-weight:900;font-size:18px;white-space:nowrap}
</style>
</head>
<body>
<header><div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1><img class="logo" id="logo" alt="무명회 로고">무명회</h1><button id="votebtn" class="btn" style="display:none;flex:none;padding:9px 14px" onclick="showVote=true;render()">참석 투표</button></div>
<p class="sub">즐겁게 실력향상을 할 수 있는 클럽</p>
<div id="who" class="sub" style="display:flex;gap:10px;align-items:center;margin-top:-6px"></div>
<nav id="nav"></nav>
</div></header>
<main><div class="wrap" id="view"></div></main>
<div id="syncst" style="text-align:center;font-size:11px;color:var(--muted);padding:4px 0 18px"></div>
<div id="modal"></div>

function anParseDate(v,fname){
  const p=n=>String(n).padStart(2,"0"),y=new Date().getFullYear();let m;
  if(typeof v==="number"){
    if(v>20000){const d=new Date(Math.round((v-25569)*86400e3));return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())}
    const pt=String(v).split(".");if(+pt[0]>=1&&+pt[0]<=12&&pt[1]&&+pt[1]>=1&&+pt[1]<=31)return y+"-"+p(+pt[0])+"-"+p(+pt[1]);
  }
  for(const t of [typeof v==="string"?v:"",fname||""]){
    if((m=t.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/)))return m[1]+"-"+p(+m[2])+"-"+p(+m[3]);
    if((m=t.match(/(\d{1,2})[./-](\d{1,2})/))&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31)return y+"-"+p(+m[1])+"-"+p(+m[2]);

/* ===== 엑셀 셀 색 읽기 (녹색=Winning shot, 주황색=Unforced error) : 외부 라이브러리 없이 xlsx(zip)에서 직접 읽음 ===== */
async function anUnzip(buf){

const anAttrs=t=>{const o={};String(t).replace(/([\w:]+)="([^"]*)"/g,(m,k,v)=>{o[k]=v;return m});return o};
/* 시트 번호(1부터) → { "B10": "theme:6:0.4", ... } 채워진 셀의 색 키 */
async function anFills(buf,sheetNo){
  const z=await anUnzip(buf),st=z["xl/styles.xml"],sh=z["xl/worksheets/sheet"+sheetNo+".xml"];
  if(!st||!sh)return {};
  const fb=(st.match(/<fills[^>]*>([\s\S]*?)<\/fills>/)||[])[1]||"";
  const fills=(fb.match(/<fill>[\s\S]*?<\/fill>|<fill\/>/g)||[]).map(f=>{
    const pf=anAttrs((f.match(/<patternFill[^>]*>/)||[""])[0]);if(!pf.patternType||pf.patternType==="none")return "";
    const fg=(f.match(/<fgColor[^>]*\/?>/)||[""])[0],a=anAttrs(fg);
    return a.rgb?"rgb:"+a.rgb:a.theme!==undefined?"theme:"+a.theme+":"+(a.tint?(+a.tint).toFixed(2):"0"):a.indexed!==undefined?"idx:"+a.indexed:""});

  const map={};(sh.match(/<c\b[^>]*>/g)||[]).forEach(c=>{const a=anAttrs(c);if(a.r&&a.s!==undefined&&xfs[+a.s])map[a.r]=xfs[+a.s]});

const anColL=c=>{let s="";c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26)}return s};
/* 점 단위 기록(코드가 칸마다 적힌 부분)을 선수별로 집계. 칸 색: 요약표의 Winning/Unforced 머리글과 같은 색이면 각각 Winning shot/Unforced error.
   서브 칸(Sp/F/D)은 서브권 순서를 1st 서브 시도 횟수와 맞춰 찾아 서버에게 배정 */
function anParsePoints(aoa,rows,opt){
  const txt=v=>String(v==null?"":v).trim();opt=opt||{};

  for(let r=0;r<Math.min(aoa.length,40)&&hr<0;r++)for(let c=0;c<(aoa[r]||[]).length;c++)if(txt(aoa[r][c]).toLowerCase()==="serve"&&txt((aoa[r]||[])[c-1])&&txt((aoa[r]||[])[c+1])){hr=r;sc=c;break}
  if(hr<0)return null;
  const pcols=[sc-2,sc-1,sc+1,sc+2].filter(c=>c>=0&&txt(aoa[hr][c])&&!/^(vs|serve)$/i.test(txt(aoa[hr][c])));
  const names=pcols.map(c=>txt(aoa[hr][c]));
  const cells=r=>[...pcols,sc].map(c=>txt((aoa[r]||[])[c])).some(Boolean);
  let last=aoa.length-1;while(last>hr&&!cells(last)&&!(typeof (aoa[last]||[])[0]==="number"))last--;
  const starts=[];for(let r=hr+1;r<=last;r++)if(typeof (aoa[r]||[])[0]==="number")starts.push(r);
  if(!starts.length)return null;

  const inc=(o,k)=>{o[k]=(o[k]||0)+1};
  segs.forEach(([s,e],gi)=>{const gn=+aoa[s][0]||gi+1,pk=gn<=4?"e":gn<=8?"m":"l";for(let r=s;r<e;r++)pcols.forEach((c,i)=>{
    const k=txt((aoa[r]||[])[c]);if(!k)return;inc(codes[names[i]],k);
    if(opt.fills){const col=opt.fills[anColL(c+(opt.c0||0))+(r+(opt.r0||0)+1)];
      if(col&&col===opt.wKey){inc(wu[names[i]].w,k);ph[names[i]][pk][0]++;sq[names[i]]+="W"}else if(col&&col===opt.uKey){inc(wu[names[i]].u,k);ph[names[i]][pk][1]++;sq[names[i]]+="U"}}})});
  const attempts={};rows.forEach(r=>{attempts[r.name]=r.s1[1]});
  const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
  const ok=perms(names).find(p=>{const t={};segs.forEach(([s,e],g)=>{t[p[g%p.length]]=(t[p[g%p.length]]||0)+(e-s)});return names.every(n=>(t[n]||0)===attempts[n])});
  if(ok)segs.forEach(([s,e],g)=>{for(let r=s;r<e;r++){const k=txt((aoa[r]||[])[sc]);if(k)inc(sv[ok[g%ok.length]],k)}});
  return {codes,sv,wu,ph,sq,serve:!!ok};
}
/* aoa: 시트를 2차원 배열로 읽은 것 → {date,type,court,rows} 또는 null */
function anParseSheet(aoa,fname,opt){
  const txt=v=>String(v==null?"":v).trim();
  let sr=-1,sc=-1;
  for(let r=0;r<Math.min(aoa.length,30)&&sr<0;r++)for(let c=0;c<(aoa[r]||[]).length;c++)if(txt(aoa[r][c])==="요약"){sr=r;sc=c;break}
  if(sr<0)return null;
  const hdr={};(aoa[sr]||[]).forEach((v,c)=>{const t=txt(v).toLowerCase().replace(/\s+/g,"");if(t)hdr[t]=c});
  const col=(k,d)=>hdr[k]!==undefined?hdr[k]:d;
  const c1=col("1stserve",sc+1),c2=col("2ndserve",sc+2),cw=col("winning",sc+3),cu=col("unforced",sc+4);
  const meta=k=>{for(let r=0;r<Math.min(aoa.length,30);r++)for(let c=0;c<(aoa[r]||[]).length;c++)if(txt(aoa[r][c]).toUpperCase()===k){for(let d=1;d<=3;d++){const v=(aoa[r]||[])[c+d];if(v!==null&&v!==undefined&&txt(v)!=="")return v}}return null};
  const rows=[];
  for(let r=sr+1;r<aoa.length;r++){const nm=txt((aoa[r]||[])[sc]);if(!nm||/^(vs|serve)$/i.test(nm))break;
    rows.push({name:nm,s1:anRatio(aoa[r][c1]),s2:anRatio(aoa[r][c2]),W:anNum(aoa[r][cw]),U:anNum(aoa[r][cu])})}
  if(!rows.length)return null;
  try{
    opt=opt||{};let wKey="",uKey="";
    if(opt.fills){const kk=c=>opt.fills[anColL(c+(opt.c0||0))+(sr+(opt.r0||0)+1)]||"";wKey=kk(cw);uKey=kk(cu)}
    const pp=anParsePoints(aoa,rows,{...opt,wKey,uKey});
    if(pp)rows.forEach(r=>{
      if(pp.codes[r.name]&&Object.keys(pp.codes[r.name]).length)r.c=pp.codes[r.name];
      if(pp.sv[r.name]&&Object.keys(pp.sv[r.name]).length)r.sv=pp.sv[r.name];
      const x=pp.wu[r.name];  // 색으로 구분한 Winning/Unforced 코드: 요약표 숫자와 같을 때만 사용
      if(x&&wKey&&uKey&&(r.W||r.U)&&anCsum(x.w)===r.W&&anCsum(x.u)===r.U){r.w=x.w;r.u=x.u;r.ph=pp.ph[r.name];r.sq=pp.sq[r.name]}})
  }catch(e){}
  const type=meta("TYPE"),court=meta("COURT");
  return {date:anParseDate(meta("DATE"),fname),type:txt(type)||"친선",court:txt(court),rows};

/* 경기 순번별 구간: 1~4 초반 · 5~8 중반 · 9~ 후반 (Winning/Unforced) */
const AN_PH=[["e","초반","1~4게임"],["m","중반","5~8게임"],["l","후반","9게임~"]];
function anPhase(list){

  list.forEach(x=>{if(x.ph){any=true;for(const k in t){t[k][0]+=(x.ph[k]||[])[0]||0;t[k][1]+=(x.ph[k]||[])[1]||0}}});
  if(!any)return null;

  if(!ks.length)return null;
  const net=k=>t[k][0]-t[k][1];
  const sorted=[...ks].sort((a,b)=>net(b)-net(a)||t[b][0]-t[a][0]);

function anPhaseView(p){

/* 시간순(엑셀 위→아래) 흐름: 같은 종류가 3번 이상 연달아 나오면 "몰림". 범실(주황)=위축, 위닝(초록)=안정감·숙련도 */

/* 코트(COURT)별 성적: 전체 5경기 이상이고 코트가 2곳 이상(각 2경기 이상)일 때만 */

  const row=(k,v)=>`<li style="padding:10px 0"><span style="color:var(--muted);width:76px;flex:none">${k}</span><div class="grow" style="text-align:right;font-weight:500">${v}</div></li>`;
  return `${myTipsPanel(m)}<div class="panel" style="padding:20px 16px"><div style="text-align:center"><label title="사진 변경" style="display:inline-block;position:relative;flex:none;min-width:0;cursor:pointer"><input type="file" accept="image/*" hidden onchange="setPhoto('${m.id}',this)">${av(m,112)}<span style="position:absolute;right:0;bottom:0;width:34px;height:34px;border-radius:50%;background:var(--ball);color:var(--ballink);display:grid;place-items:center;font-size:17px;border:3px solid var(--surface)">📷</span></label><div style="font-size:22px;font-weight:900;margin-top:10px">${esc(m.name)} ${m.role?`<span class="tag ok" style="vertical-align:middle">${m.role}</span> `:""}${isNew(m)?'<span class="tag ok" style="vertical-align:middle">신입회원</span>':""}</div><div class="row" style="justify-content:center;margin-top:12px"><label class="btn" style="display:inline-block;flex:none;min-width:0;cursor:pointer"><input type="file" accept="image/*" hidden onchange="setPhoto('${m.id}',this)">사진 변경</label>${m.photo?`<button class="btn off" onclick="resetPhoto('${m.id}')">${PHOTOS[m.name]?"원래 사진으로":"사진 삭제"}</button>`:""}</div></div>
  <div class="stats" style="margin:18px 0 6px"><div class="stat"><b>${rank}</b><span>순위</span></div><div class="stat"><b>${s.w}승 ${s.l}패</b><span>전적</span></div><div class="stat"><b>${n?Math.round(s.w/n*100)+"%":"-"}</b><span>승률</span></div><div class="stat"><b>${ptsOf(m)}P</b><span>포인트</span></div></div>

  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn off" onclick="openPw()">비밀번호 변경</button><button class="btn off" onclick="logout()">로그아웃</button></div></div>

roster(){

const fmtPh4=v=>{let d=String(v).replace(/\D/g,"");if(d.startsWith("010"))d=d.slice(3);d=d.slice(0,4);return d?"010-****-"+d:""};
const lastDigits=p=>String(p||"").replace(/\D/g,"").slice(-4);
const fmtPhone=v=>{let d=String(v).replace(/\D/g,"").slice(0,11);
  if(d.length<=3)return d;
  if(d.startsWith("02")){if(d.length<=2)return d;const r=d.slice(2);return d.length<=6?`02-${r}`:d.length<=9?`02-${r.slice(0,3)}-${r.slice(3)}`:`02-${r.slice(0,4)}-${r.slice(4,8)}`}
  if(d.length<=7)return `${d.slice(0,3)}-${d.slice(3)}`;
  if(d.length<=10)return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`};
const maskPh=p=>{const d=String(p||"").replace(/\D/g,"");return d.length>=10?d.slice(0,3)+"-****-"+d.slice(-4):String(p||"")};

function recoPanel(){
  const u=upcoming()[0];if(!u)return"";
  const st=stats(),v=S.votes[u.ds]||{},at=S.attend[u.ds]||{};
  const ps=S.members.filter(m=>v[m.id]==="yes"||at[m.id]);
  const rate=m=>{const s=st[m.id]||{w:0,l:0};return (s.w+1)/(s.w+s.l+2)};      // 기록이 적으면 50%쪽으로 보정
  const shown=m=>{const s=st[m.id]||{w:0,l:0};return s.w+s.l?Math.round(s.w/(s.w+s.l)*100)+"%":"기록 없음"};
  const when=`${u.d.getMonth()+1}/${u.d.getDate()} (${DAYS[u.d.getDay()]}) ${fmtT(u.s.start)}`;
  const wrap=b=>`<div class="panel"><h2>오늘의 추천매치</h2><p style="margin:-6px 0 8px;font-size:12px;color:var(--muted)">${when} 참석자 ${ps.length}명 기준</p>${b}</div>`;
  if(ps.length<4)return wrap(`<p class="empty">참석자가 4명 이상 모이면 승률이 비슷한 사람끼리 2게임을 추천해요.</p>`);
  const sorted=[...ps].sort((x,y)=>rate(x)-rate(y)||x.name.localeCompare(y.name,"ko"));
  const wins=[];for(let i=0;i+4<=sorted.length;i++){const g=sorted.slice(i,i+4);wins.push({g,spread:rate(g[3])-rate(g[0])})}
  const splits=g=>[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]].map(s=>{const A=s[0].map(i=>g[i]),B=s[1].map(i=>g[i]);
    return {A,B,diff:Math.abs(A.reduce((t,m)=>t+rate(m),0)-B.reduce((t,m)=>t+rate(m),0))/2}}).sort((x,y)=>x.diff-y.diff);
  const key=t=>[t.A.map(m=>m.id).sort().join(),t.B.map(m=>m.id).sort().join()].sort().join("|");
  let games=[];
  if(wins.length===1){const sp=splits(wins[0].g);games=[sp[0],sp[1]]}
  else{let best=null;
    for(let a=0;a<wins.length;a++)for(let b=a+1;b<wins.length;b++){
      const ov=wins[a].g.filter(m=>wins[b].g.includes(m)).length,cost=wins[a].spread+wins[b].spread+ov*0.3;
      if(!best||cost<best.cost)best={cost,a,b}}
    games=[splits(wins[best.a].g)[0],splits(wins[best.b].g)[0]];
    if(key(games[0])===key(games[1]))games[1]=splits(wins[best.b].g)[1]}
  const pl=m=>`<span style="display:flex;align-items:center;gap:3px;margin:2px 0;white-space:nowrap">${av(m,20)}<span>${nameR(m)}</span><small style="color:var(--muted);font-size:10px">${shown(m)}</small></span>`;
  const rows=games.map((g,i)=>{const d=Math.round(g.diff*100);
    return `<li style="display:block;padding:10px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><b>추천 ${i+1}게임</b><span class="tag ${d<=5?"ok":""}">${d<=5?"박빙":"전력 차 "+d+"%p"}</span></div><div style="display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:3px;align-items:center;font-size:13px;line-height:1.7">${[["A팀",g.A],["B팀",g.B]].map(t=>`<div style="align-self:stretch;border:1.5px solid var(--line);border-radius:10px;padding:6px 6px"><b style="display:block;font-size:12px;color:var(--muted)">${t[0]}</b>${t[1].map(pl).join("")}</div>`).join(`<div style="position:relative;width:20px;height:24px;display:grid;place-items:center;overflow:hidden"><span style="font-size:19px;line-height:1">🔥</span><b style="position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:7px;font-weight:900;letter-spacing:0;color:#fff;text-shadow:0 0 2px #b3260f,0 1px 1px #b3260f,0 0 4px #b3260f">VS</b></div>`)}</div></li>`}).join("");
  return wrap(`<ul class="list">${rows}</ul><p style="margin:6px 0 0;font-size:12px;color:var(--muted)">승률이 비슷한 참석자끼리 묶고, 두 팀 전력이 비슷하도록 나눴어요. (기록이 적은 사람은 50% 쪽으로 보정)</p>`)}

  $("#modal").innerHTML=showVote?`<div class="modal" onclick="if(event.target===this)closeVote()"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0">이번 경기, 참석하시나요?</h2><button class="btn ghost" onclick="closeVote()">닫기</button></div>${V.votes()}</div></div>`:"";
  if(pwOpen)$("#modal").innerHTML=pwView();
  else if(profileId)$("#modal").innerHTML=profView();
  else if(guestView)$("#modal").innerHTML=guestCardView();
  else if(tipModal>=0)$("#modal").innerHTML=tipView();
  const ns=document.querySelector(".sheet");if(ns)ns.scrollTop=st;
  setSyncStatus();
  if(!bkAuto&&isAdmin()){bkAuto=true;const l=bkList();if(!l.length||l[0].ts<lastMonday()){if(makeBackup(true))render()}}
}

/* ===== 여러 사람이 함께 쓰는 공유 데이터 동기화 (Netlify Functions + Blobs) =====
   서버(/api/state)가 없는 곳(예: 미리보기)에서는 자동으로 꺼지고 이 기기에만 저장됩니다. */
const SYNC={retryInit:false,initing:false,on:false,rev:0,base:null,busy:false,dirty:false,timer:null,retry:null,last:0,err:false,pendingRender:false};
const jclone=x=>JSON.parse(JSON.stringify(x));
const isObjC=v=>v!==null&&typeof v==="object"&&!Array.isArray(v);
const isIdArr=a=>Array.isArray(a)&&a.every(e=>isObjC(e)&&typeof e.id==="string"&&e.id[0]!=="@");
function diffS(a,b,p,ops){
  if(isObjC(a)&&isObjC(b)){
    for(const k of Object.keys(b)){
      if(!(k in a)){
        if(isObjC(b[k])&&Object.keys(b[k]).length)diffS({},b[k],[...p,k],ops);        // 새 항목도 칸 단위로 쪼개서 보냄 (동시 입력 보호)
        else if(Array.isArray(b[k])&&b[k].length&&isIdArr(b[k]))diffS([],b[k],[...p,k],ops);
        else ops.push({p:[...p,k],v:b[k]});
      }else diffS(a[k],b[k],[...p,k],ops)}
    for(const k of Object.keys(a))if(!(k in b))ops.push({p:[...p,k],d:1});
  }else if(isIdArr(a)&&isIdArr(b)){
    const am=new Map(a.map(x=>[x.id,x])),bm=new Map(b.map(x=>[x.id,x]));
    for(const x of b){if(!am.has(x.id))ops.push({p,add:x});else diffS(am.get(x.id),x,[...p,"@"+x.id],ops)}
    for(const x of a)if(!bm.has(x.id))ops.push({p,rm:x.id});
  }else if(JSON.stringify(a)!==JSON.stringify(b))ops.push({p,v:b});
}
function parentOfS(st,p){let cur=st;for(let i=0;i<p.length-1;i++){const k=p[i];
  if(k[0]==="@"){cur=Array.isArray(cur)?cur.find(x=>x&&x.id===k.slice(1)):undefined;if(!cur)return null}
  else{if(!isObjC(cur))return null;if(cur[k]===undefined)cur[k]={};cur=cur[k]}}
  return [cur,p[p.length-1]]}
function applyOpsS(st,ops){for(const op of ops){
  if(!op||!Array.isArray(op.p)||op.p.length===0||op.p.some(k=>typeof k!=="string"||k==="__proto__"||k==="constructor"||k==="prototype"))continue;
  const r=parentOfS(st,op.p);if(!r)continue;const [parent,last]=r;
  if("add" in op){if(!isObjC(parent))continue;if(!Array.isArray(parent[last]))parent[last]=[];if(!parent[last].some(x=>x&&x.id===op.add.id))parent[last].push(op.add)}
  else if("rm" in op){if(isObjC(parent)&&Array.isArray(parent[last]))parent[last]=parent[last].filter(x=>!(x&&x.id===op.rm))}
  else if(op.d){if(isObjC(parent))delete parent[last]}
  else if("v" in op){if(last[0]==="@"){if(Array.isArray(parent)){const i=parent.findIndex(x=>x&&x.id===last.slice(1));if(i>=0)parent[i]=op.v}}else if(isObjC(parent))parent[last]=op.v}
}return st}
function ensureS(){
  ["sponsors","bookings","matches","awards","guests","purchases","members","analysis"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
  ["invites","tips","attend","votes","officers","imports"].forEach(k=>{if(!isObjC(S[k]))S[k]={}});
  if(!Array.isArray(S.schedule)||!S.schedule.length)S.schedule=[{day:6,start:"20:00",end:"23:00"},{day:0,start:"18:00",end:"21:00"}];
}
function adoptS(st){S=jclone(st);ensureS()}
function writeLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function apiS(method,body){
  const r=await fetch("/api/state"+(method==="GET"?"?rev="+SYNC.rev:""),{method,headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  if(!r.ok)throw new Error("http "+r.status);
  const j=await r.json();if(!j||j.ok!==true)throw new Error("bad");return j}
function setSyncStatus(){const el=document.getElementById("syncst");if(!el)return;
  if(!SYNC.on){el.textContent="";return}
  const t=new Date(SYNC.last),p=n=>String(n).padStart(2,"0");
  el.textContent=SYNC.err?"● 연결이 불안정해요 — 연결되면 자동으로 다시 저장됩니다":"● 모두와 공유 중 · "+p(t.getHours())+":"+p(t.getMinutes())+" 동기화됨"}
const isTypingNow=()=>{const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
function softRender(){if(isTypingNow()){SYNC.pendingRender=true;return}render()}
const localHasData=()=>(S.matches||[]).length||Object.keys(S.votes||{}).length||(S.awards||[]).length||Object.keys(S.attend||{}).length;
async function syncInit(){
  let r;
  try{r=await Promise.race([apiS("GET"),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),6000))])}catch(e){SYNC.retryInit=(e instanceof TypeError)||e.message==="timeout";return false}
  SYNC.retryInit=false;
  SYNC.on=true;SYNC.rev=r.rev;
  let force=false;try{force=localStorage.getItem(KEY+"-push")==="1"}catch(e){}
  if(r.state&&!force){
    try{if(localHasData())makeBackup(true)}catch(e){}   // 이 기기의 기존 데이터는 백업으로 보관
    adoptS(r.state);SYNC.base=jclone(S);writeLocal();
  }else{
    SYNC.base={};                                       // 서버가 비었거나 복원 요청 → 이 기기 데이터로 전체 교체
    try{const j=await apiS("POST",{ops:[{p:[],v:jclone(S)}]});SYNC.rev=j.rev;SYNC.base=jclone(j.state);
      try{localStorage.removeItem(KEY+"-push")}catch(e){}}catch(e){SYNC.err=true}
  }
  SYNC.last=Date.now();return true}
function syncKick(){try{if(!SYNC.on)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncPush,400)}catch(e){}}
async function syncPush(){
  if(!SYNC.on)return;
  if(SYNC.busy){SYNC.dirty=true;return}
  const cur=jclone(S),ops=[];diffS(SYNC.base,cur,[],ops);
  if(!ops.length)return;
  SYNC.busy=true;
  try{
    const j=await apiS("POST",{ops});
    const later=[];diffS(cur,jclone(S),[],later);       // 전송 중에 새로 생긴 내 변경
    const remote=[];diffS(cur,j.state,[],remote);        // 그 사이 다른 사람이 바꾼 내용
    adoptS(j.state);applyOpsS(S,later);ensureS();
    SYNC.rev=j.rev;SYNC.base=jclone(j.state);SYNC.err=false;SYNC.last=Date.now();writeLocal();
    if(remote.length)softRender();
  }catch(e){SYNC.err=true;clearTimeout(SYNC.retry);SYNC.retry=setTimeout(syncPush,5000)}
  finally{SYNC.busy=false;setSyncStatus();if(SYNC.dirty){SYNC.dirty=false;syncKick()}}}
async function syncPull(){
  if(document.hidden)return;
  if(!SYNC.on){if(SYNC.retryInit&&!SYNC.initing){SYNC.initing=true;try{if(await syncInit()){render();setSyncStatus()}}catch(e){}SYNC.initing=false}return}
  if(SYNC.busy)return;
  SYNC.busy=true;
  try{
    const j=await apiS("GET");
    if(!j.same){
      const pending=[];diffS(SYNC.base,jclone(S),[],pending);
      adoptS(j.state);applyOpsS(S,pending);ensureS();
      SYNC.rev=j.rev;SYNC.base=jclone(j.state);writeLocal();softRender();
    }
    SYNC.err=false;SYNC.last=Date.now();
  }catch(e){SYNC.err=true}
  finally{SYNC.busy=false;setSyncStatus();if(SYNC.dirty){SYNC.dirty=false;syncKick()}}}
document.addEventListener("focusout",()=>{if(SYNC.pendingRender){SYNC.pendingRender=false;setTimeout(()=>{if(!isTypingNow())render()},150)}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncPull()});
window.addEventListener("focus",()=>syncPull());
window.addEventListener("online",()=>{syncKick();syncPull()});
setInterval(syncPull,20000);
const boot=()=>{showVote=!!S.members.find(m=>m.id===me);render();setSyncStatus()};
$("#view").innerHTML='<p class="empty" style="padding:40px 0;text-align:center">불러오는 중…</p>';
syncInit().catch(()=>false).then(boot);
setInterval(tickRem,30000);
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
setInterval(tickTips,2000);
</script>
